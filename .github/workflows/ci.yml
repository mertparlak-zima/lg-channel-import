name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, docker, lg-tv-channel-sort]
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build channel list from reference export
        working-directory: scripts
        env:
          PYTHONIOENCODING: utf-8
        run: python3 build_channel_list.py
      - name: Run TLL verification contract
        env:
          PYTHONIOENCODING: utf-8
        run: python3 scripts/verify_channel_list.py
